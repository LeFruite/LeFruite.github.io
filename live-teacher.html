<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Живий урок — табло вчителя</title>
<script src="config.js"></script>
<script src="qr-lite.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@700;800&family=Roboto+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f1f4f8; --panel:#fff; --panel2:#eef2f7; --ink:#1d2a44; --steel:#3a4a66; --muted:#5c6b82; --line:#c5cfdc; --accent:#8a6a1f; --gold-soft:#f6edd5; --blue:#2f5fb3; --ok:#2e7d4f; --bad:#b3342b;
          --c0:#2f5fb3; --c1:#8a6a1f; --c2:#6b4fa3; --c3:#1f7a7a; --c4:#b03a6b; --c5:#5c8a2e; }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--ink); font:19px/1.45 "Roboto Condensed",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
         background-color:var(--bg); background-image:linear-gradient(#dde4ed 1px,transparent 1px),linear-gradient(90deg,#dde4ed 1px,transparent 1px); background-size:28px 28px; }
  button { font:inherit; cursor:pointer; }
  .hidden { display:none !important; }
  .center { max-width:660px; margin:6vh auto; padding:0 18px; }
  .panel, .stage, .roster { background:var(--panel); border:2px solid var(--steel); border-radius:6px; box-shadow:7px 7px 0 rgba(58,74,102,.14); }
  .panel { padding:24px; }
  h1, .res h2 { font-family:"Noto Serif",Georgia,serif; font-weight:800; }
  h1 { font-size:30px; margin:0 0 6px; } h2 { font-size:20px; margin:18px 0 8px; }
  .muted { color:var(--muted); }
  input, select { width:100%; font:inherit; padding:12px; border-radius:6px; border:2px solid var(--line); background:#fff; color:var(--ink); }
  label.f { display:block; font-size:15px; color:var(--muted); font-weight:700; margin:14px 0 6px; }
  .btn { border:2px solid var(--ink); border-radius:6px; padding:11px 20px; font-weight:700; background:var(--ink); color:#fff; }
  .btn:hover { background:#101a2e; }
  .btn.ghost { background:#fff; color:var(--ink); border-color:var(--line); } .btn.ghost:hover { border-color:var(--steel); background:var(--panel2); }
  .btn.red { background:var(--bad); border-color:var(--bad); color:#fff; } .btn.green { background:var(--ok); border-color:var(--ok); color:#fff; }
  .btn[disabled] { opacity:.4; cursor:default; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:2px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:6px 16px; font-weight:700; }
  .chip.on { background:var(--blue); border-color:var(--blue); color:#fff; }
  .err { color:var(--bad); margin-top:10px; min-height:1.4em; }

  .board { padding:16px 24px 30px; max-width:1560px; margin:0 auto; }
  .bar { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:16px; }
  .bar .ttl { font-family:"Noto Serif",Georgia,serif; font-weight:800; font-size:22px; flex:1; min-width:220px; }
  .dots { display:flex; gap:6px; flex-wrap:wrap; }
  .dot { width:36px; height:36px; border-radius:50%; border:2px solid var(--line); background:#fff; color:var(--muted); font-weight:700; }
  .dot.cur { background:var(--ink); border-color:var(--ink); color:#fff; } .dot.past { background:var(--panel2); border-color:var(--steel); color:var(--ink); }
  .join { display:flex; align-items:center; gap:12px; background:#fff; border:2px solid var(--steel); border-radius:6px; padding:8px 12px; }
  .join .code { font-size:28px; font-weight:700; letter-spacing:.12em; color:var(--accent); }
  .join .qr { background:#fff; line-height:0; cursor:zoom-in; }
  .grid { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:20px; align-items:start; }
  @media (max-width:1000px) { .grid { grid-template-columns:1fr; } }
  .stage { padding:26px; }
  .kick { font-size:15px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
  .stage h1 { font-size:38px; line-height:1.15; margin:6px 0 12px; }
  .stage .prompt { font-size:28px; font-weight:700; line-height:1.28; margin:8px 0 14px; font-family:"Noto Serif",Georgia,serif; }
  .stage .text { font-size:21px; color:#33425c; margin:0 0 12px; }
  .fig { margin:12px 0 16px; border:2px solid var(--steel); border-radius:4px; overflow:hidden; background:#fff; }
  .fig img { display:block; width:100%; max-height:300px; object-fit:cover; }
  .fig figcaption { font-size:15px; color:var(--muted); padding:7px 12px; border-top:2px solid var(--steel); background:var(--bg); }
  .res { border-radius:6px; padding:18px 22px; margin:16px 0; border:2px solid; }
  .res.good { background:#e3f2e9; border-color:var(--ok); color:#1d5a37; } .res.bad { background:#fbe9e7; border-color:var(--bad); color:#8f241c; } .res.info { background:#e4ecf8; border-color:var(--blue); color:var(--ink); }
  .res h2 { margin:0 0 6px; font-size:34px; line-height:1.1; } .res p { margin:0; font-size:21px; color:var(--ink); }
  .ctl { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
  .tally { margin:12px 0 4px; display:grid; gap:8px; }
  .trow { display:grid; grid-template-columns:minmax(120px,38%) 1fr 36px; gap:10px; align-items:center; }
  .trow .lab { font-size:18px; font-weight:600; } .trow .n { font-weight:700; text-align:right; }
  .trow .track { background:var(--panel2); border:1px solid var(--line); border-radius:4px; height:22px; overflow:hidden; } .trow .fill { height:100%; transition:width .4s; }
  .mine { margin-top:16px; padding:12px 14px; border-radius:6px; background:var(--gold-soft); border:2px solid #cdb36a; }
  .mine .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .mine .btn { padding:9px 14px; }
  .mine .btn.sel { background:var(--ink); color:#fff; border-color:var(--ink); }
  .roster { padding:20px; }
  .rh { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:8px; }
  .rh b { font-family:"Noto Serif",Georgia,serif; font-size:22px; }
  .grp { margin:14px 0 6px; font-size:15px; font-weight:700; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }
  .pl { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px; }
  .pl.one { grid-template-columns:1fr; } .pl.dim { opacity:.9; }
  .p { background:var(--panel2); border:2px solid var(--line); border-radius:6px; padding:8px 12px; min-height:48px; }
  .p .l1 { display:flex; align-items:center; gap:9px; }
  .p .cl { font-size:13px; color:var(--muted); white-space:nowrap; }
  .p .st { width:10px; height:10px; border-radius:50%; background:#aab6c6; flex:none; }
  .p.on .st { background:var(--ok); } .p.off .st { background:#d19a1e; }
  .p.none { opacity:.5; }
  .p .nm { flex:1; font-weight:700; font-size:17px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .p .vt { font-weight:700; font-size:15px; border-radius:4px; padding:2px 9px; color:#fff; background:var(--blue); margin-top:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .p.voted { border-color:var(--steel); background:#fff; }
  .p.me .nm::after { content:" (ви)"; color:var(--accent); }
  .p.right { border-color:var(--ok); } .p.wrong { border-color:var(--bad); }
  .roles { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:12px 0; } .rc { border:2px solid; border-radius:6px; padding:12px 14px; background:#fff; } .rc p { margin:6px 0 0; font-size:18px; color:#33425c; }
  .hints { display:grid; gap:6px; margin:10px 0; font-size:18px; color:#33425c; }
  .pulse { animation:pulse 1.2s infinite; } @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(179,52,43,.6); } 50% { box-shadow:0 0 0 12px rgba(179,52,43,0); } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation:none; } }
  .modal { position:fixed; inset:0; background:rgba(15,24,41,.94); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; z-index:50; cursor:zoom-out; color:#fff; }
  .modal .qrbig { background:#fff; padding:18px; border-radius:8px; line-height:0; }
  .modal .url { font-size:28px; font-weight:700; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:6px; font-weight:600; z-index:60; }
</style>
</head>
<body>

<div id="login" class="center hidden">
  <div class="panel"><h1>Табло вчителя</h1><p class="muted">Введіть пін-код кабінету.</p>
    <input type="password" id="pin" autocomplete="current-password" aria-label="Пін-код"><div class="err" id="lerr"></div>
    <button class="btn" id="lgo">Увійти</button></div>
</div>

<div id="setup" class="center hidden">
  <div class="panel">
    <h1>Живий урок</h1>
    <p class="muted">Інтерактивна симуляція: учні підключаються з планшетів, а на цьому екрані видно їхні імена та голоси.</p>
    <label class="f" for="sc">Сценарій</label><select id="sc"></select>
    <label class="f">Групи, які беруть участь</label><div class="chips" id="gr"></div>
    <label class="f" for="tn">Ваше ім'я на табло (ви теж голосуєте)</label><input id="tn" maxlength="40" value="Вчитель">
    <div class="err" id="serr"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
      <button class="btn" id="mk">Почати урок</button>
    </div>
    <h2>Продовжити початий урок</h2>
    <div style="display:flex;gap:10px"><input id="oc" placeholder="Код уроку, наприклад k7m2xq" style="flex:1"><button class="btn ghost" id="oo">Відкрити</button></div>
  </div>
</div>

<div id="board" class="board hidden">
  <div class="bar">
    <div class="ttl" id="b-title"></div>
    <div class="dots" id="b-dots"></div>
    <div class="join"><div><div class="muted" style="font-size:13px">Код уроку</div><div class="code" id="b-code"></div></div><div class="qr" id="b-qr" title="Збільшити"></div></div>
    <button class="btn ghost" id="b-end">Завершити урок</button>
  </div>
  <div class="grid">
    <div class="stage" id="stage"></div>
    <div class="roster" id="roster"></div>
  </div>
</div>
<div id="qrm" class="modal hidden"><div class="qrbig" id="qrbig"></div><div class="url" id="qrurl"></div><div class="muted">Торкніться, щоб закрити</div></div>
<div id="toast" class="hidden"></div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let IMGS = {};
  async function loadImgs(title) {
    try {
      const list = await (await fetch('live/index.json?r=' + Date.now())).json(), it = list.find(x => x.title === title); if (!it) return;
      const sc = await (await fetch('live/' + it.file + '?r=' + Date.now())).json();
      sc.screens.forEach(s => { if (s.img) IMGS[s.id] = { src: 'live/' + s.img, cap: s.imgCap || '' }; });
    } catch (e) {}
  }
  const figure = id => IMGS[id] ? '<figure class="fig"><img src="' + esc(IMGS[id].src) + '" alt="' + esc(IMGS[id].cap) + '">' + (IMGS[id].cap ? '<figcaption>' + esc(IMGS[id].cap) + '</figcaption>' : '') + '</figure>' : '';
  const COL = ['var(--c0)', 'var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)'];
  let PIN = '', SID = '', NAME = 'Вчитель', ST = null, timer = null, last = '', groups = [], sel = new Set();
  try { PIN = sessionStorage.getItem('pin') || ''; SID = localStorage.getItem('live_sid') || ''; NAME = localStorage.getItem('live_tname') || 'Вчитель'; } catch (e) {}
  const show = id => ['login', 'setup', 'board'].forEach(x => $(x).classList.toggle('hidden', x !== id));
  function toast(t) { const e = $('toast'); e.textContent = t; e.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.add('hidden'), 2600); }

  async function api(action, data) {
    const body = new URLSearchParams(Object.assign({ action, pin: PIN }, data || {}));
    let j;
    try { j = await (await fetch(SCRIPT_URL, { method: 'POST', body })).json(); } catch (e) { throw new Error('Немає зв\'язку із сервером. Переконайтеся, що в Apps Script опубліковано нову версію.'); }
    if (j.error === 'pin') { PIN = ''; try { sessionStorage.removeItem('pin'); } catch (e) {} show('login'); throw new Error('pin'); }
    if (j.error) throw new Error(j.error);
    return j;
  }

  /* --- вхід --- */
  async function boot() {
    if (!PIN) return show('login');
    try { await api('t_auth'); } catch (e) { return; }
    if (SID) { try { await api('t_live_state', { id: SID, name: NAME }); return openBoard(); } catch (e) { SID = ''; } }
    openSetup();
  }
  $('lgo').onclick = async () => {
    PIN = $('pin').value; $('lerr').textContent = '';
    try { await api('t_auth'); try { sessionStorage.setItem('pin', PIN); } catch (e) {} boot(); } catch (e) { if (e.message !== 'pin') $('lerr').textContent = e.message; else $('lerr').textContent = 'Невірний пін'; }
  };
  $('pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('lgo').click(); });

  /* --- налаштування --- */
  async function openSetup() {
    show('setup'); $('tn').value = NAME;
    try {
      const list = await (await fetch('live/index.json?r=' + Date.now())).json();
      $('sc').innerHTML = list.map(x => '<option value="' + esc(x.file) + '">' + esc(x.title) + '</option>').join('');
      const r = await api('t_roster'); groups = Object.keys(r.groups).filter(g => r.groups[g].length);
      $('gr').innerHTML = groups.map(g => '<button class="chip" data-g="' + esc(g) + '">' + esc(g) + '</button>').join('') || '<span class="muted">У журналі немає груп із учнями.</span>';
      $('gr').querySelectorAll('.chip').forEach(b => b.onclick = () => { const g = b.dataset.g; sel.has(g) ? sel.delete(g) : sel.add(g); b.classList.toggle('on', sel.has(g)); });
    } catch (e) { $('serr').textContent = e.message; }
  }
  $('mk').onclick = async () => {
    $('serr').textContent = '';
    if (!sel.size) return void ($('serr').textContent = 'Оберіть хоча б одну групу.');
    NAME = $('tn').value.trim() || 'Вчитель'; try { localStorage.setItem('live_tname', NAME); } catch (e) {}
    try {
      const sc = await (await fetch('live/' + $('sc').value + '?r=' + Date.now())).text();
      const j = await api('t_live_create', { scenario: sc, groups: JSON.stringify([...sel]) });
      SID = j.id; try { localStorage.setItem('live_sid', SID); } catch (e) {}
      openBoard();
    } catch (e) { $('serr').textContent = 'Не вдалося створити урок: ' + e.message; }
  };
  $('oo').onclick = async () => {
    const id = $('oc').value.trim().toLowerCase(); if (!id) return;
    NAME = $('tn').value.trim() || 'Вчитель'; try { localStorage.setItem('live_tname', NAME); } catch (e) {}
    try { await api('t_live_state', { id, name: NAME }); SID = id; try { localStorage.setItem('live_sid', SID); } catch (e) {} openBoard(); } catch (e) { $('serr').textContent = 'Урок не знайдено.'; }
  };

  /* --- табло --- */
  const studentUrl = () => location.href.replace(/[^/]*$/, '') + 'live.html?s=' + SID;
  function openBoard() {
    show('board'); last = '';
    $('b-code').textContent = SID.toUpperCase();
    try { $('b-qr').innerHTML = QRLite.svg(studentUrl(), 84); } catch (e) { $('b-qr').textContent = ''; }
    $('b-qr').onclick = () => { try { $('qrbig').innerHTML = QRLite.svg(studentUrl(), 360); } catch (e) {} $('qrurl').textContent = studentUrl().replace(/^https?:\/\//, ''); $('qrm').classList.remove('hidden'); };
    $('qrm').onclick = () => $('qrm').classList.add('hidden');
    clearInterval(timer); poll(); timer = setInterval(poll, 2000);
    api('t_live_state', { id: SID, name: NAME }).then(f => loadImgs(f.title)).then(() => { last = ''; poll(); }).catch(() => {});
  }
  async function poll() {
    try { ST = await api('t_live_state', { id: SID, name: NAME }); } catch (e) { if (e.message === 'not_found') { clearInterval(timer); try { localStorage.removeItem('live_sid'); } catch (er) {} SID = ''; openSetup(); } return; }
    const key = JSON.stringify(ST); if (key === last) return; last = key; render();
  }
  function chart(m, dark, hh) {
    const W = 600, H = hh || 250, L = 46, R = 14, T = 14, B = 26, n = Math.max(m.series.length - 1, m.cap || 0, 6);
    const X = i => L + (W - L - R) * i / n, Y = v => T + (H - T - B) * (1 - v / m.start);
    const pts = m.series.map((v, i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ');
    const last = m.series.length - 1, ink = dark ? '#eef3f7' : '#14212b', mut = dark ? '#9db0bf' : '#5d6b76', line = dark ? '#ff6b5e' : '#b42318';
    let g = '';
    [0, .5, 1].forEach(f => { const y = Y(m.start * f); g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="' + mut + '" stroke-opacity=".25"/><text x="' + (L - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="13" fill="' + mut + '">' + Math.round(m.start * f) + '</text>'; });
    const ty = Y(m.threshold);
    g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + ty + '" y2="' + ty + '" stroke="#8a6a1f" stroke-width="2" stroke-dasharray="7 5"/><text x="' + (W - R) + '" y="' + (ty - 6) + '" text-anchor="end" font-size="13" fill="#8a6a1f">поріг відступу</text>';
    g += '<polygon points="' + X(0) + ',' + Y(0) + ' ' + pts + ' ' + X(last) + ',' + Y(0) + '" fill="' + line + '" fill-opacity=".14"/>';
    g += '<polyline points="' + pts + '" fill="none" stroke="' + line + '" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="' + X(last) + '" cy="' + Y(m.now) + '" r="7" fill="' + line + '"/>';
    return '<div style="margin:14px 0"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><b>' + esc(m.label) + '</b><span style="font-size:32px;font-weight:800;color:' + line + '">' + Math.round(m.now) + ' <span style="font-size:15px;color:' + mut + '">' + esc(m.unit) + '</span></span></div>' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block" role="img" aria-label="Графік: ' + esc(m.label) + ' зараз ' + Math.round(m.now) + '">' + g + '</svg></div>';
  }
  const short = n => n.split(/\s+/).slice(0, 2).join(' ');
  const RC = { ark: 'var(--c0)', agg: 'var(--bad)' };
  const optOf = (role, i) => { const o = ST.screen.optionsBy && ST.screen.optionsBy[role] && ST.screen.optionsBy[role][+i]; return o ? (o.s || o.t) : '?'; };

  function render() {
    const s = ST, sc = s.screen, P = s.players;
    $('b-title').textContent = s.title;
    $('b-dots').innerHTML = s.outline.map((o, i) => '<button class="dot ' + (i === s.step ? 'cur' : (i < s.step ? 'past' : '')) + '" data-i="' + i + '" title="' + esc(o.title) + '" aria-label="Крок ' + (i + 1) + '">' + (i + 1) + '</button>').join('');
    $('b-dots').querySelectorAll('.dot').forEach(b => b.onclick = () => ctl('goto', b.dataset.i));
    const real = P.filter(p => !p.teacher), joinedReal = real.filter(p => p.state !== 'none').length, voted = P.filter(p => p.vote !== null).length, me = P.find(p => p.teacher);
    const rn = { ark: s.roles.ark.title, agg: s.roles.agg.title };
    // --- сцена
    let h = '<div class="kick">' + esc(sc.title) + ' · ' + (s.step + 1) + ' / ' + s.total + '</div>';
    if (sc.kind === 'info') {
      h += '<h1>' + esc(sc.title) + '</h1>' + figure(sc.id) + (sc.text ? '<p class="text">' + esc(sc.text) + '</p>' : '') + (sc.prompt ? '<div class="prompt">' + esc(sc.prompt) + '</div>' : '');
      if (s.step === 0) h += '<div class="roles"><div class="rc" style="border-color:var(--c0)"><b>' + esc(rn.ark) + '</b> · ' + s.counts.ark + '<p>' + esc(s.roles.ark.text) + '</p></div><div class="rc" style="border-color:var(--bad)"><b>' + esc(rn.agg) + '</b> · ' + s.counts.agg + '<p>' + esc(s.roles.agg.text) + '</p></div></div>';
    } else h += figure(sc.id) + '<div class="prompt">' + esc(sc.prompt) + '</div>';
    if (sc.hintBy && !s.meter) h += '<div class="hints"><div><b style="color:var(--c0)">' + esc(rn.ark) + ':</b> ' + esc(sc.hintBy.ark) + '</div><div><b style="color:var(--bad)">' + esc(rn.agg) + ':</b> ' + esc(sc.hintBy.agg) + '</div></div>';
    if (sc.kind === 'press') h += '<div class="muted">Кнопка в учнів: «' + esc(sc.button) + '»</div><div class="tally"><div class="trow"><div class="lab">Проголосували</div><div class="track"><div class="fill" style="width:' + (joinedReal ? Math.round(voted / (joinedReal + 1) * 100) : 0) + '%;background:var(--ok)"></div></div><div class="n">' + voted + '</div></div></div>';
    if (s.meter) {
      h += chart(s.meter, false, 200);
      if (false) h += '<div class="hints"><div><b style="color:var(--c0)">' + esc(rn.ark) + ':</b> ' + esc(sc.hintBy.ark) + '</div><div><b style="color:var(--bad)">' + esc(rn.agg) + ':</b> ' + esc(sc.hintBy.agg) + '</div></div>';
      if (s.meter.reached && !s.revealed) h += '<div class="res info" style="margin:10px 0"><b>Скарбниця нижча за поріг. Агресор більше не може продовжувати: час відступати.</b></div>';
    }
    if (sc.kind === 'choice') {
      const bars = (role, opts, title) => {
        const cnt = opts.map((_, i) => P.filter(p => (role ? p.role === role : true) && p.vote === String(i) && (role || sc.common)).length), tot = Math.max(1, cnt.reduce((a, b) => a + b, 0));
        return (title ? '<div class="grp" style="color:' + RC[role] + '">' + esc(title) + '</div>' : '') + '<div class="tally">' + opts.map((o, i) => '<div class="trow"><div class="lab">' + esc(o.s || o.t) + (s.revealed && s.correct === i ? ' ✓' : '') + '</div><div class="track"><div class="fill" style="width:' + Math.round(cnt[i] / tot * 100) + '%;background:' + COL[i % 6] + '"></div></div><div class="n">' + cnt[i] + '</div></div>').join('') + '</div>';
      };
      h += sc.common ? bars(null, sc.optionsBy.ark) : bars('ark', sc.optionsBy.ark, rn.ark) + bars('agg', sc.optionsBy.agg, rn.agg);
    }
    if (s.meter && sc.hintBy) h += '<div class="hints"><div><b style="color:var(--c0)">' + esc(rn.ark) + ':</b> ' + esc(sc.hintBy.ark) + '</div><div><b style="color:var(--bad)">' + esc(rn.agg) + ':</b> ' + esc(sc.hintBy.agg) + '</div></div>';
    if (s.revealed && s.result) h += '<div class="res ' + esc(s.result.tone) + '"><h2>' + esc(s.result.title) + '</h2><p>' + esc(s.result.text) + '</p></div>';
    // --- голос вчителя (він агресор)
    if ((sc.kind === 'press' || sc.kind === 'choice') && !s.revealed) {
      h += '<div class="mine"><b>Ваш вибір як агресора (' + esc(NAME) + ')</b><div class="row">' + (sc.kind === 'press'
        ? '<button class="btn ' + (me && me.vote !== null ? 'green' : 'ghost') + '" data-tv="1">' + (me && me.vote !== null ? '✓ Ви проголосували' : esc(sc.button)) + '</button>'
        : sc.optionsBy.agg.map((o, i) => '<button class="btn ghost' + (me && me.vote === String(i) ? ' sel' : '') + '" data-tv="' + i + '">' + esc(o.t) + '</button>').join('')) + '</div></div>';
    }
    // --- керування
    h += '<div class="ctl"><button class="btn ghost" data-c="prev"' + (s.step === 0 ? ' disabled' : '') + '>← Назад</button>';
    if (s.result) h += s.revealed ? '<button class="btn ghost" data-c="hide">Сховати результат</button>' : '<button class="btn red' + (s.meter && s.meter.reached ? ' pulse' : '') + '" data-c="reveal">' + esc(s.revealLabel) + '</button>';
    if (sc.kind !== 'info') h += '<button class="btn ghost" data-c="clear">Очистити голоси</button>';
    if (s.step === 0) h += '<button class="btn ghost" data-c="roles" title="Розподілити ролі заново">Перемішати ролі</button>';
    h += '<button class="btn" data-c="next"' + (s.step === s.total - 1 ? ' disabled' : '') + '>Далі →</button></div>';
    $('stage').innerHTML = h;
    $('stage').querySelectorAll('[data-c]').forEach(b => b.onclick = () => ctl(b.dataset.c));
    $('stage').querySelectorAll('[data-tv]').forEach(b => b.onclick = () => tvote(sc.id, b.dataset.tv));
    // --- учасники за ролями
    const chip = p => {
      let cls = 'p ' + p.state + (p.vote !== null ? ' voted' : '') + (p.teacher ? ' me' : '');
      if (s.revealed && s.correct !== null && p.vote !== null) cls += (+p.vote === s.correct ? ' right' : ' wrong');
      const lab = p.vote === null ? '' : (sc.kind === 'press' ? '✓ натиснув' : optOf(p.role || 'ark', p.vote)), full = p.vote === null ? '' : (sc.kind === 'press' ? sc.button : ((sc.optionsBy[p.role || 'ark'][+p.vote] || {}).t || ''));
      return '<div class="' + cls + '"><div class="l1"><span class="st"></span><span class="nm" title="' + esc(p.name) + '">' + esc(short(p.name)) + '</span><span class="cl">' + esc(p.cls) + '</span></div>' +
        (lab ? '<div class="vt" title="' + esc(full) + '" style="background:' + (sc.kind === 'choice' ? COL[+p.vote % 6] : 'var(--ok)') + '">' + esc(lab) + '</div>' : '') + '</div>';
    };
    let r = '<div class="rh"><b>Учасники</b><span class="muted">підключено ' + joinedReal + ' з ' + real.length + ' · зробили вибір ' + voted + '</span></div>';
    r += '<div class="pl one">' + chip(Object.assign({}, me, { cls: 'агресор (вчитель)' })) + '</div>';
    [['agg', 'agg'], ['ark', 'ark']].forEach(([k]) => {});
    ['ark', 'agg'].forEach(k => {
      const list = real.filter(p => p.role === k);
      r += '<div class="grp" style="color:' + RC[k] + '">' + esc(rn[k]) + ' · ' + list.length + '</div><div class="pl">' + (list.map(chip).join('') || '<span class="muted">Поки нікого</span>') + '</div>';
    });
    const none = real.filter(p => !p.role);
    if (none.length) r += '<div class="grp">Ще не підключились · ' + none.length + '</div><div class="pl dim">' + none.map(p => '<div class="p none"><div class="l1"><span class="st"></span><span class="nm">' + esc(short(p.name)) + '</span><span class="cl">' + esc(p.cls) + '</span></div></div>').join('') + '</div>';
    $('roster').innerHTML = r;
  }
  async function ctl(op, value) { try { await api('t_live_ctl', { id: SID, op, value: value == null ? '' : value, name: NAME }); last = ''; poll(); } catch (e) { toast('Помилка: ' + e.message); } }
  async function tvote(screen, v) { try { await api('t_live_vote', { id: SID, name: NAME, screen, v }); last = ''; poll(); } catch (e) { toast(e.message === 'closed' ? 'Голосування вже закрите' : 'Помилка: ' + e.message); } }
  $('b-end').onclick = async () => {
    if (!confirm('Завершити урок? Учні побачать «Урок завершено», голоси буде видалено.')) return;
    try { await api('t_live_ctl', { id: SID, op: 'delete' }); } catch (e) {}
    clearInterval(timer); try { localStorage.removeItem('live_sid'); } catch (e) {} SID = ''; openSetup();
  };
  boot();
})();
</script>
</body>
</html>
