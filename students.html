<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Списки груп</title>
<script src="config.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f7a5a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Самостійні">
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>

<style>
  :root { --bg:#f3f1ea; --card:#fff; --ink:#1d2a2e; --muted:#667378; --line:#dcd9ce; --accent:#1f7a5a; --accent-dark:#17614a; --accent-soft:#e3f2ec; --bad:#c0392b; --bad-soft:#fbe0dc; --amber:#b87503; --amber-soft:#fdefc9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  .hidden { display:none !important; }
  .top { background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .top-in { max-width:1100px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .brand { font-weight:800; font-size:18px; flex:1; min-width:180px; }
  .wrap { max-width:1100px; margin:0 auto; padding:16px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .btn { border:1.5px solid var(--accent); background:var(--accent); color:#fff; border-radius:10px; padding:9px 16px; font:inherit; font-weight:700; cursor:pointer; text-decoration:none; display:inline-block; }
  .btn:hover { background:var(--accent-dark); }
  .btn.ghost { background:#fff; color:var(--ink); border-color:var(--line); } .btn.ghost:hover { border-color:var(--accent); }
  .btn.on { background:var(--accent-soft); color:var(--accent-dark); border-color:var(--accent); }
  .btn[disabled] { opacity:.45; cursor:default; }
  input, select { font:inherit; padding:8px 10px; border:1.5px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); max-width:100%; }
  label.f { display:block; font-size:13px; font-weight:700; color:var(--muted); margin-bottom:3px; }
  .ctl { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px; }
  .muted { color:var(--muted); } .err { color:var(--bad); font-weight:600; }
  h1 { margin:0 0 10px; font-size:24px; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:10px; z-index:20; max-width:90vw; }
  #toast.bad { background:var(--bad); }

  .stu { display:grid; grid-template-columns:32px 1fr 110px 44px; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); }
  .stu:last-child { border-bottom:0; }
  .stu .n { color:var(--muted); font-size:13px; text-align:right; }
  .stu input { width:100%; } .stu select { width:100%; padding:7px 6px; }
  .stu .x { border:1.5px solid var(--line); background:#fff; border-radius:8px; padding:7px 0; cursor:pointer; color:var(--bad); font-weight:800; }
  .stu .x:hover { border-color:var(--bad); background:var(--bad-soft); }
  .stu.saving input { background:var(--accent-soft); } .stu.err input { border-color:var(--bad); }
  .addbox { margin-top:16px; padding-top:14px; border-top:2px solid var(--line); }
  textarea { font:inherit; padding:8px 10px; border:1.5px solid var(--line); border-radius:8px; width:100%; background:#fff; color:var(--ink); }
  @media (max-width:640px) { .wrap { padding:10px; } .stu { grid-template-columns:1fr 86px 40px; } .stu .n { display:none; } }
</style>
</head>
<body>
<div class="top"><div class="top-in"><div class="brand">Списки груп</div>
  <a class="btn ghost" href="seating.html">Розсадка</a><a class="btn ghost" href="journal.html">Журнал оцінок</a><a class="btn ghost" href="editor.html">Кабінет вчителя</a></div></div>

<div class="wrap">
  <div id="login" class="panel hidden" style="max-width:380px;margin:40px auto">
    <h1>Пін вчителя</h1><input id="pin" type="password" placeholder="Пін" style="width:100%"><div style="height:10px"></div>
    <button class="btn" id="login-go" style="width:100%">Увійти</button><div class="err" id="lerr"></div>
  </div>

  <div id="app" class="hidden">
    <div class="ctl"><div><label class="f">Група</label><select id="cls"></select></div><div class="muted" id="cnt"></div></div>
    <div class="panel">
      <div id="list"></div>
      <div class="addbox">
        <label class="f">Додати учнів у цю групу (кожне ім'я з нового рядка: Прізвище Ім'я По батькові)</label>
        <textarea id="newnames" rows="3" placeholder="Іваненко Марія Петрівна"></textarea>
        <div style="margin-top:10px"><button class="btn" id="add">+ Додати</button></div>
        <p class="muted" style="font-size:13px;margin:10px 0 0">Імена зберігаються в аркуші «Журнал N клас» у вашій таблиці. «✕» прибирає учня з групи (зі списків на сайті), але його рядок і оцінки в журналі лишаються.</p>
      </div>
    </div>
  </div>
</div>
<div id="toast" class="hidden"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let PIN = ''; try { PIN = sessionStorage.getItem('pin') || ''; } catch (e) {}
  let D = { groups: [], students: {} }, busy = false;
  function toast(m, bad) { const t = $('toast'); t.textContent = m; t.className = bad ? 'bad' : ''; clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), bad ? 6000 : 2600); }
  async function api(action, data) {
    let r; try { r = await fetch(SCRIPT_URL, { method: 'POST', body: new URLSearchParams(Object.assign({ action, pin: PIN }, data || {})) }); } catch (e) { throw new Error('Немає зв\'язку із сервером'); }
    let j; try { j = await r.json(); } catch (e) { throw new Error('Сервер відповів незрозуміло. Опублікуйте оновлений Code.gs (Нова версія).'); }
    if (j.error === 'pin') { PIN = ''; try { sessionStorage.removeItem('pin'); } catch (e) {} showLogin(); throw new Error('pin'); }
    if (j.error) throw new Error(j.error);
    return j;
  }
  function showLogin(msg) { $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('lerr').textContent = msg || ''; }
  $('login-go').onclick = async () => {
    PIN = $('pin').value; try { await api('t_auth'); try { sessionStorage.setItem('pin', PIN); } catch (e) {} boot(); }
    catch (e) { $('lerr').textContent = e.message === 'pin' ? 'Невірний пін' : e.message; }
  };
  $('pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('login-go').click(); });

  const gradeOf = g => (String(g).match(/^\d+/) || [''])[0];
  const cmp = (a, b) => a.localeCompare(b, 'uk', { numeric: true });
  const cur = () => $('cls').value;

  function fillGroups(keep) {
    const sel = $('cls'), prev = keep || sel.value;
    sel.innerHTML = D.groups.slice().sort(cmp).map(g => '<option>' + esc(g) + '</option>').join('');
    if (D.groups.includes(prev)) sel.value = prev;
  }
  function draw() {
    const g = cur(), list = (D.students[g] || []).slice().sort((a, b) => a.name.localeCompare(b.name, 'uk'));
    const same = D.groups.filter(x => gradeOf(x) === gradeOf(g)).sort(cmp);
    $('cnt').textContent = 'Учнів: ' + list.length;
    $('list').innerHTML = list.length ? list.map((s, i) =>
      '<div class="stu" data-grade="' + esc(s.grade) + '" data-row="' + s.row + '" data-old="' + esc(s.name) + '"><span class="n">' + (i + 1) + '</span>' +
      '<input type="text" value="' + esc(s.name) + '" aria-label="Ім\'я">' +
      '<select aria-label="Група">' + same.map(x => '<option' + (x === g ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '</select>' +
      '<button class="x" title="Прибрати з групи">✕</button></div>').join('') : '<div class="muted">У цій групі ще немає учнів.</div>';
  }
  function apply(r, keep) { D = r; fillGroups(keep); draw(); }

  async function mutate(data, row) {
    if (busy) return; busy = true; if (row) row.classList.add('saving');
    try { const r = await api('t_stu', data); apply(r, cur()); return r; }
    catch (e) { if (e.message !== 'pin') { toast(e.message, true); if (row) row.classList.add('err'); } }
    finally { busy = false; if (row) row.classList.remove('saving'); }
  }
  $('list').addEventListener('change', async e => {
    const row = e.target.closest('.stu'); if (!row) return;
    const name = row.querySelector('input').value.trim(), group = row.querySelector('select').value;
    if (e.target.tagName === 'INPUT' && name === row.dataset.old) return;
    const r = await mutate({ kind: 'edit', grade: row.dataset.grade, row: row.dataset.row, old: row.dataset.old, name, group }, row);
    if (r) toast('Збережено');
  });
  $('list').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') e.target.blur(); });
  $('list').addEventListener('click', async e => {
    const b = e.target.closest('.x'); if (!b) return;
    const row = b.closest('.stu');
    if (!confirm('Прибрати «' + row.dataset.old + '» з групи ' + cur() + '?\nЙого рядок і оцінки в журналі залишаться.')) return;
    const r = await mutate({ kind: 'remove', grade: row.dataset.grade, row: row.dataset.row, old: row.dataset.old }, row);
    if (r) toast('Прибрано з групи');
  });
  $('add').onclick = async () => {
    const names = $('newnames').value; if (!names.trim()) return toast('Введіть хоча б одне ім\'я', true);
    const r = await mutate({ kind: 'add', group: cur(), names });
    if (r) { $('newnames').value = ''; toast('Додано: ' + r.added + (r.skipped && r.skipped.length ? '. Пропущено: ' + r.skipped.join('; ') : ''), !!(r.skipped && r.skipped.length && !r.added)); }
  };
  $('cls').addEventListener('change', draw);

  async function boot() {
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    try { apply(await api('t_stu_get')); }
    catch (e) { if (e.message !== 'pin') toast(e.message, true); }
  }
  if (PIN) boot().catch(() => {}); else showLogin();
})();
</script>
</body>
</html>
