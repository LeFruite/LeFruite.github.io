<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Розсадка і відвідуваність</title>
<script src="config.js"></script>
<style>
  :root { --bg:#f3f1ea; --card:#fff; --ink:#1d2a2e; --muted:#667378; --line:#dcd9ce; --accent:#1f7a5a; --accent-dark:#17614a; --accent-soft:#e3f2ec; --bad:#c0392b; --bad-soft:#fbe0dc; --amber:#b87503; --amber-soft:#fdefc9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  .hidden { display:none !important; }
  .top { background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .top-in { max-width:1100px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .brand { font-weight:800; font-size:18px; flex:1; min-width:180px; }
  .wrap { max-width:1100px; margin:0 auto; padding:16px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .btn { border:1.5px solid var(--accent); background:var(--accent); color:#fff; border-radius:10px; padding:9px 16px; font:inherit; font-weight:700; cursor:pointer; text-decoration:none; display:inline-block; }
  .btn:hover { background:var(--accent-dark); }
  .btn.ghost { background:#fff; color:var(--ink); border-color:var(--line); } .btn.ghost:hover { border-color:var(--accent); }
  .btn.on { background:var(--accent-soft); color:var(--accent-dark); border-color:var(--accent); }
  .btn[disabled] { opacity:.45; cursor:default; }
  input, select { font:inherit; padding:8px 10px; border:1.5px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); max-width:100%; }
  label.f { display:block; font-size:13px; font-weight:700; color:var(--muted); margin-bottom:3px; }
  .ctl { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px; }
  .muted { color:var(--muted); } .err { color:var(--bad); font-weight:600; }
  h1 { margin:0 0 10px; font-size:24px; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:10px; z-index:20; max-width:90vw; }
  #toast.bad { background:var(--bad); }

  .room { display:flex; flex-direction:column; gap:10px; }
  .room.top-board { flex-direction:column-reverse; }
  .hall { display:flex; gap:10px; align-items:stretch; }
  .hall.win-left { flex-direction:row-reverse; }
  .desks { flex:1; display:grid; gap:0; border:2px solid var(--ink); border-radius:6px; background:#fff; min-width:0; }
  .desk.big { display:grid; grid-template-columns:1fr 1fr; align-content:center; }
  .desk { border:1px solid var(--ink); padding:6px; display:flex; flex-direction:column; gap:6px; justify-content:center; min-height:84px; min-width:0; }
  .win { writing-mode:vertical-rl; text-orientation:upright; letter-spacing:2px; font-weight:800; font-size:13px; border:2px solid var(--ink); border-radius:6px; display:flex; align-items:center; justify-content:center; padding:6px 2px; background:#fff; }
  .board { border:2px solid var(--ink); border-radius:6px; padding:12px 18px; font-weight:800; letter-spacing:.1em; background:#fff; }
  .seat { display:block; width:100%; border:1.5px solid transparent; border-radius:8px; padding:8px 10px; text-align:left; font:inherit; background:#f7f6f1; color:var(--ink); min-height:40px; cursor:pointer; line-height:1.25; }
  .seat:hover { border-color:var(--accent); }
  .seat.empty { background:transparent; cursor:default; border-style:dashed; border-color:#e5e2d8; }
  .seat.n { background:var(--bad); color:#fff; font-weight:700; }
  .seat.z { background:var(--amber-soft); border-color:var(--amber); color:#6b4600; font-weight:700; }
  .seat.g { background:var(--accent-soft,#e3f2ec); border-color:var(--accent,#1f7a5a); font-weight:700; }
  .seat .tag { float:right; font-weight:800; margin-left:6px; }
  .seat-sel { width:100%; padding:6px; font-size:14px; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:14px; margin:10px 0; align-items:center; }
  .sw { display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:-2px; margin-right:5px; }
  .sum { font-weight:700; }
  .pool { margin-top:14px; } .pool .seat { display:inline-block; width:auto; margin:0 6px 6px 0; }
  .sv { font-size:14px; font-weight:700; } .sv.ok { color:var(--accent-dark); } .sv.bad { color:var(--bad); }
  @media (max-width:640px) { .wrap { padding:10px; } .desk { min-height:70px; padding:4px; } .seat { padding:6px; font-size:14px; } }
  #gp { position:fixed; inset:0; z-index:9999; background:rgba(20,28,30,.96); color:#fff; display:flex; flex-direction:column; padding:16px; overflow:auto; }
  #gp .nm { font-size:22px; font-weight:800; text-align:center; margin:6px 0 2px; } #gp .sub { text-align:center; opacity:.75; margin-bottom:14px; }
  #gp .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; flex:1; max-width:520px; width:100%; margin:0 auto; align-content:stretch; }
  #gp button { font:inherit; font-weight:800; font-size:30px; border:0; border-radius:16px; color:#1d2a2e; background:#fff; min-height:72px; cursor:pointer; }
  #gp button.cur { outline:5px solid #ffd54a; }
  #gp .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:520px; width:100%; margin:12px auto 0; }
  #gp .row2 button { font-size:20px; min-height:60px; } #gp .abs { background:#e05a4a; color:#fff; } #gp .clr { background:#4a5a60; color:#fff; } #gp .cls { background:transparent; color:#fff; border:2px solid #7b8b90; }
</style>
</head>
<body>
<div class="top"><div class="top-in"><div class="brand">Розсадка і відвідуваність</div>
  <a class="btn ghost" href="editor.html">Кабінет вчителя</a></div></div>

<div class="wrap">
  <div id="login" class="panel hidden" style="max-width:380px;margin:40px auto">
    <h1>Пін вчителя</h1><input id="pin" type="password" placeholder="Пін" style="width:100%"><div style="height:10px"></div>
    <button class="btn" id="login-go" style="width:100%">Увійти</button><div class="err" id="lerr"></div>
  </div>

  <div id="app" class="hidden">
    <div class="ctl">
      <div><label class="f">Група</label><select id="cls"></select></div>
      <div><label class="f">Кабінет</label><select id="room-sel"><option value="">Звичайний кабінет</option><option value="Кабінет хімії">Кабінет хімії</option></select></div>
      <div id="datebox"><label class="f">Дата</label><input type="date" id="date"></div>
      <div id="lessonbox"><label class="f">Урок (необов'язково)</label><select id="lesson"><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div>
      <div style="display:flex;gap:6px"><button class="btn on" id="m-att">Відвідуваність</button><button class="btn ghost" id="m-edit">Налаштувати розсадку</button></div>
      <span class="sv" id="sv"></span>
    </div>

    <div id="att-view" class="panel">
      <div class="legend"><span><i class="sw" style="background:#f7f6f1;border:1px solid var(--line)"></i>Присутній (нічого не пишемо)</span><span><i class="sw" style="background:var(--bad)"></i>Н — відсутній</span><span class="muted">Торкніться імені: Н → З → скасувати</span><span class="sum" id="sum"></span><span><i class="sw" style="background:var(--accent-soft,#e3f2ec);border:1px solid var(--accent,#1f7a5a)"></i>Число — оцінка за урок</span></div>
      <div id="room"></div>
      <div class="pool" id="pool"></div>
    </div>

    <div id="edit-view" class="panel hidden">
      <div class="ctl">
        <div><label class="f">Рядів</label><input type="number" id="e-rows" min="1" max="10" style="width:80px"></div>
        <div><label class="f">Парт у ряду</label><input type="number" id="e-cols" min="1" max="8" style="width:80px"></div>
        <div><label class="f">Місць за партою</label><input type="number" id="e-seats" min="1" max="16" style="width:80px"></div>
        <div><label class="f">Дошка</label><select id="e-board"><option value="bottom">знизу</option><option value="top">зверху</option></select></div>
        <div><label class="f">Вікна</label><select id="e-win"><option value="right">праворуч</option><option value="left">ліворуч</option><option value="none">немає</option></select></div>
      </div>
      <div class="ctl"><button class="btn ghost" id="e-tables">Великі столи…</button><button class="btn ghost" id="e-fill">Заповнити за абеткою</button><button class="btn ghost" id="e-clear">Очистити схему</button>
        <button class="btn ghost" id="e-imp">Імпорт зі схеми (файл)</button><input type="file" id="e-file" accept=".json" class="hidden">
        <button class="btn" id="e-save">Зберегти розсадку</button></div>
      <div class="muted" style="font-size:14px;margin-bottom:8px">Оберіть учня в кожному місці. Якщо учень уже сидить деінде, його буде переміщено. Порожня парта лишається порожньою.</div>
      <div id="e-room"></div>
      <div class="pool" id="e-pool"></div>
    </div>
  </div>
</div>
<div id="toast" class="hidden"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let PIN = ''; try { PIN = sessionStorage.getItem('pin') || ''; } catch (e) {}
  let ROSTER = {}, LAY = null, MARKS = {}, GRADES = {}, dirty = false, mode = 'att', loadSeq = 0;
  const short = n => String(n).trim().split(/\s+/).slice(0, 2).join(' ');
  const cls = () => $('cls').value, room = () => $('room-sel').value;
  function toast(m, bad) { const t = $('toast'); t.textContent = m; t.className = bad ? 'bad' : ''; clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), bad ? 5000 : 2200); }
  function sv(kind, txt) { const e = $('sv'); e.className = 'sv ' + kind; e.textContent = txt; }

  async function api(action, data) {
    let r; try { r = await fetch(SCRIPT_URL, { method: 'POST', body: new URLSearchParams(Object.assign({ action, pin: PIN }, data || {})) }); } catch (e) { throw new Error('Немає зв\'язку із сервером'); }
    let j; try { j = await r.json(); } catch (e) { throw new Error('Сервер відповів незрозуміло. Опублікуйте оновлений Code.gs (Нова версія).'); }
    if (j.error === 'pin') { PIN = ''; try { sessionStorage.removeItem('pin'); } catch (e) {} showLogin(); throw new Error('pin'); }
    if (j.error) throw new Error(j.error);
    return j;
  }
  function showLogin(msg) { $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('lerr').textContent = msg || ''; }
  $('login-go').onclick = async () => {
    PIN = $('pin').value; try { await api('t_auth'); try { sessionStorage.setItem('pin', PIN); } catch (e) {} boot(); }
    catch (e) { $('lerr').textContent = e.message === 'pin' ? 'Невірний пін' : e.message; }
  };
  $('pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('login-go').click(); });

  const todayIso = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  async function boot() {
    if (!SCRIPT_URL) { $('lerr').textContent = 'Не задано адресу сервера (config.js).'; return showLogin('Не задано адресу сервера (config.js).'); }
    if (!PIN) return showLogin();
    try { ROSTER = (await api('t_roster')).groups || {}; } catch (e) { if (e.message !== 'pin') showLogin(e.message); return; }
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    const s = $('cls'); s.length = 0;
    Object.keys(ROSTER).sort((a, b) => a.localeCompare(b, 'uk', { numeric: true })).forEach(c => s.add(new Option(c, c)));
    let last = ''; try { last = localStorage.getItem('seat_cls') || ''; } catch (e) {}
    if (last && ROSTER[last]) s.value = last;
    try { $('room-sel').value = localStorage.getItem('seat_room') || ''; } catch (e) {}
    $('date').value = todayIso(); loadAll();
  }

  /* ---------- схема ---------- */
  function emptyLayout(rows, cols, seats) { return { rows: rows, cols: cols, seats: seats, board: 'bottom', win: 'right', grid: Array.from({ length: rows }, () => Array.from({ length: cols }, () => Array(seats).fill(''))) }; }
  function normLayout(L) {
    if (!L || !L.grid) return null;
    L.rows = L.grid.length; L.cols = Math.max(1, ...L.grid.map(r => r.length)); L.seats = Math.max(1, ...L.grid.flat().map(d => d.length));
    L.grid = L.grid.map(r => Array.from({ length: L.cols }, (_, i) => Array.from({ length: L.seats }, (_, k) => (r[i] || [])[k] || '')));
    L.board = L.board === 'top' ? 'top' : 'bottom'; L.win = ['left', 'none'].includes(L.win) ? L.win : 'right'; return L;
  }
  async function loadAll() {
    const my = ++loadSeq, c = cls(); if (!c) return;
    try { localStorage.setItem('seat_cls', c); localStorage.setItem('seat_room', room()); } catch (e) {}
    sv('', 'Завантаження…');
    try {
      const [a, b] = await Promise.all([api('t_seat_get', { cls: c, room: room() }), api('t_att_get', { cls: c, date: $('date').value, lesson: $('lesson').value })]);
      if (my !== loadSeq) return;
      LAY = normLayout(a.layout) || null; MARKS = b.marks || {}; GRADES = b.grades || {}; dirty = false; sv('', '');
      if (!LAY) { LAY = emptyLayout(4, 3, 2); if (mode === 'att') { mode = 'edit'; } }
      draw();
    } catch (e) { if (e.message !== 'pin') sv('bad', 'Помилка: ' + e.message); }
  }
  ['cls', 'date', 'lesson', 'room-sel'].forEach(id => $(id).addEventListener('change', () => { if (dirty && !confirm('Є незбережені зміни розсадки. Перейти без збереження?')) return; loadAll(); }));
  $('m-att').onclick = () => { if (dirty && !confirm('Є незбережені зміни розсадки. Перейти без збереження?')) return; mode = 'att'; if (dirty) loadAll(); else draw(); };
  $('m-edit').onclick = () => { mode = 'edit'; draw(); };

  function seated() { return new Set(LAY.grid.flat(2).filter(Boolean)); }
  function roomHtml(inner) {
    const L = LAY, desks = '<div class="desks" style="grid-template-columns:repeat(' + L.cols + ',1fr)">' + inner + '</div>';
    const win = L.win === 'none' ? '' : '<div class="win">ВІКНА</div>';
    return '<div class="room ' + (L.board === 'top' ? 'top-board' : '') + '"><div class="hall ' + (L.win === 'left' ? 'win-left' : '') + '">' + desks + win + '</div><div class="board">ДОШКА</div></div>';
  }
  function draw() {
    $('m-att').className = 'btn ' + (mode === 'att' ? 'on' : 'ghost'); $('m-edit').className = 'btn ' + (mode === 'edit' ? 'on' : 'ghost');
    $('att-view').classList.toggle('hidden', mode !== 'att'); $('edit-view').classList.toggle('hidden', mode !== 'edit');
    $('datebox').classList.toggle('hidden', mode !== 'att'); $('lessonbox').classList.toggle('hidden', mode !== 'att');
    mode === 'att' ? drawAtt() : drawEdit();
  }

  /* ---------- відвідуваність ---------- */
  function seatBtn(name) {
    if (!name) return '<div class="seat empty"></div>';
    const m = MARKS[name] || '', g = GRADES[name] || ''; return '<button class="seat ' + (m === 'Н' ? 'n' : g ? 'g' : '') + '" data-n="' + esc(name) + '">' + (m ? '<span class="tag">' + m + '</span>' : g ? '<span class="tag">' + esc(g) + '</span>' : '') + esc(short(name)) + '</button>';
  }
  function drawAtt() {
    $('room').innerHTML = roomHtml(LAY.grid.flat().map(d => '<div class="desk' + (d.length > 3 ? ' big' : '') + '">' + d.map(seatBtn).join('') + '</div>').join(''));
    const s = seated(), rest = (ROSTER[cls()] || []).filter(n => !s.has(n));
    $('pool').innerHTML = rest.length ? '<div class="muted" style="margin-bottom:6px">Без місця в схемі:</div>' + rest.map(seatBtn).join('') : '';
    const n = Object.values(MARKS).filter(v => v === 'Н').length, ng = Object.keys(GRADES).length;
    $('sum').textContent = 'Н: ' + n + (ng ? ' · Оцінок: ' + ng : '');
  }
  let chain = Promise.resolve(), pending = 0;
  const send = (action, data, onFail) => {   // запити йдуть суворо по черзі, щоб порядок кліків збігався з порядком запису
    pending++; sv('', 'Зберігаю…');
    chain = chain.then(() => api(action, Object.assign({ cls: cls(), date: $('date').value, lesson: $('lesson').value }, data)))
      .then(() => { pending--; if (!pending) sv('ok', '✓ Записано в журнал'); })
      .catch(err => { pending--; onFail(); sv('bad', 'Не збережено: ' + (err.message === 'ambiguous' ? 'учня не вдалося однозначно знайти в журналі' : err.message)); if (err.message !== 'pin') toast('Не вдалося записати для ' + short(data.name), true); });
    return chain;
  };
  function setAbs(name, nxt) {   // Н ↔ порожньо
    const old = MARKS[name] || ''; if (nxt) MARKS[name] = nxt; else delete MARKS[name]; drawAtt();
    send('t_att_set', { name, mark: nxt }, () => { if (old) MARKS[name] = old; else delete MARKS[name]; drawAtt(); });
  }
  function setGrade(name, g) {
    const old = GRADES[name] || ''; if (g) GRADES[name] = g; else delete GRADES[name]; drawAtt();
    send('t_grade_set', { name, grade: g }, () => { if (old) GRADES[name] = old; else delete GRADES[name]; drawAtt(); });
  }
  /* повноекранний вибір оцінки: тап по учню */
  function openPicker(name) {
    closePicker(); const cur = GRADES[name] || '', isN = MARKS[name] === 'Н', box = document.createElement('div'); box.id = 'gp'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', 'Оцінка для ' + name);
    let btns = ''; for (let i = 1; i <= 12; i++) btns += '<button data-g="' + i + '" class="' + (String(i) === cur ? 'cur' : '') + '">' + i + '</button>';
    box.innerHTML = '<div class="nm">' + esc(name) + '</div><div class="sub">' + esc($('date').value) + (cur ? ' · зараз: ' + cur : '') + (isN ? ' · відмічено Н' : '') + '</div><div class="grid">' + btns + '</div>' +
      '<div class="row2"><button class="abs" data-a="1">' + (isN ? 'Зняти Н' : 'Н — відсутній') + '</button><button class="clr" data-c="1">Прибрати оцінку</button></div>' +
      '<div class="row2"><button class="cls" data-x="1" style="grid-column:1/3">Закрити</button></div>';
    box.addEventListener('click', e => {
      const t = e.target.closest('button'); if (!t) { if (e.target === box) closePicker(); return; }
      if (t.dataset.g) { setGrade(name, t.dataset.g); if (isN) setAbs(name, ''); }
      else if (t.dataset.a) setAbs(name, isN ? '' : 'Н');
      else if (t.dataset.c) setGrade(name, '');
      closePicker();
    });
    document.body.appendChild(box); try { history.pushState({ gp: 1 }, ''); } catch (e) {}
  }
  function closePicker() { const b = $('gp'); if (b) b.remove(); }
  window.addEventListener('popstate', closePicker);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); });
  document.addEventListener('click', e => {
    const b = e.target.closest('#att-view .seat[data-n]'); if (!b) return;
    openPicker(b.dataset.n);
  });

  /* ---------- налаштування розсадки ---------- */
  function drawEdit() {
    const L = LAY; $('e-rows').value = L.rows; $('e-cols').value = L.cols; $('e-seats').value = L.seats; $('e-board').value = L.board; $('e-win').value = L.win;
    const opts = ['<option value="">—</option>'].concat((ROSTER[cls()] || []).map(n => '<option value="' + esc(n) + '">' + esc(short(n)) + '</option>'));
    $('e-room').innerHTML = roomHtml(L.grid.map((r, ri) => r.map((d, ci) => '<div class="desk' + (d.length > 3 ? ' big' : '') + '">' + d.map((nm, k) => {
      const extra = nm && !(ROSTER[cls()] || []).includes(nm) ? '<option value="' + esc(nm) + '" selected>' + esc(short(nm)) + ' (не зі списку)</option>' : '';
      return '<select class="seat-sel" data-r="' + ri + '" data-c="' + ci + '" data-k="' + k + '">' + opts.join('').replace('value="' + esc(nm) + '"', 'value="' + esc(nm) + '" selected') + extra + '</select>';
    }).join('') + '</div>').join('')).join(''));
    // значення (якщо імені немає серед варіантів — додано окремо)
    $('e-room').querySelectorAll('select').forEach(s => { const nm = L.grid[+s.dataset.r][+s.dataset.c][+s.dataset.k]; if (nm && ![...s.options].some(o => o.value === nm)) s.add(new Option(short(nm) + ' (не зі списку)', nm)); s.value = nm; });
    const st = seated(), rest = (ROSTER[cls()] || []).filter(n => !st.has(n));
    $('e-pool').innerHTML = rest.length ? '<div class="muted" style="margin-bottom:6px">Ще без місця (' + rest.length + '):</div>' + rest.map(n => '<span class="seat" style="cursor:default">' + esc(short(n)) + '</span>').join('') : '<div class="muted">Усіх учнів розсаджено.</div>';
    sv(dirty ? 'bad' : '', dirty ? 'Є незбережені зміни' : '');
  }
  function resize() {
    const L = LAY, rows = Math.max(1, Math.min(10, +$('e-rows').value || 1)), cols = Math.max(1, Math.min(8, +$('e-cols').value || 1)), seats = Math.max(1, Math.min(16, +$('e-seats').value || 1));
    L.grid = Array.from({ length: rows }, (_, r) => Array.from({ length: cols }, (_, c) => Array.from({ length: seats }, (_, k) => ((L.grid[r] || [])[c] || [])[k] || '')));
    L.rows = rows; L.cols = cols; L.seats = seats; dirty = true; drawEdit();
  }
  ['e-rows', 'e-cols', 'e-seats'].forEach(id => $(id).addEventListener('change', resize));
  $('e-board').onchange = () => { LAY.board = $('e-board').value; dirty = true; drawEdit(); };
  $('e-win').onchange = () => { LAY.win = $('e-win').value; dirty = true; drawEdit(); };
  document.addEventListener('change', e => {
    const s = e.target.closest('#e-room select.seat-sel'); if (!s) return;
    const v = s.value, L = LAY;
    if (v) L.grid.forEach(r => r.forEach(d => d.forEach((x, k) => { if (x === v) d[k] = ''; })));
    L.grid[+s.dataset.r][+s.dataset.c][+s.dataset.k] = v; dirty = true; drawEdit();
  });
  $('e-tables').onclick = () => {   // кілька великих столів: один ряд, кожен стіл — одна «парта» з багатьма місцями
    const n = Math.max(1, Math.min(8, parseInt(prompt('Скільки великих столів?', '2'), 10) || 0)); if (!n) return;
    const cnt = (ROSTER[cls()] || []).length, seats = Math.max(2, Math.min(16, Math.ceil(cnt / n)));
    LAY = emptyLayout(1, n, seats); dirty = true; drawEdit(); toast('Створено ' + n + ' ст. по ' + seats + ' місць. Тепер «Заповнити за абеткою» або оберіть учнів вручну');
  };
  $('e-fill').onclick = () => {
    if (!confirm('Розсадити всіх за абеткою, починаючи з першого ряду? Поточну схему буде замінено.')) return;
    const names = (ROSTER[cls()] || []).slice().sort((a, b) => a.localeCompare(b, 'uk')); let i = 0;
    LAY.grid = LAY.grid.map(r => r.map(d => d.map(() => names[i++] || ''))); dirty = true; drawEdit();
    if (i < names.length) toast('У схемі не вистачає місць для ' + (names.length - Math.min(i, names.length) + 0) + ' учн.: збільште ряди чи парти', true);
  };
  $('e-clear').onclick = () => { if (!confirm('Очистити всі місця?')) return; LAY.grid = LAY.grid.map(r => r.map(d => d.map(() => ''))); dirty = true; drawEdit(); };
  $('e-imp').onclick = () => $('e-file').click();
  $('e-file').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try { let j = JSON.parse(await f.text()); if (j.layouts) j = j.layouts[cls()] || j.layouts[Object.keys(j.layouts)[0]]; const L = normLayout(j); if (!L) throw 0; LAY = L; dirty = true; drawEdit(); toast('Схему завантажено, перевірте й натисніть «Зберегти розсадку»'); }
    catch (err) { toast('Не вдалося прочитати файл схеми', true); }
  };
  $('e-save').onclick = async () => {
    try { await api('t_seat_save', { cls: cls(), room: room(), json: JSON.stringify(LAY) }); dirty = false; toast('Розсадку збережено'); sv('ok', '✓ Збережено'); }
    catch (err) { if (err.message !== 'pin') toast('Не вдалося зберегти: ' + err.message, true); }
  };
  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  boot();
})();
</script>
<script src="nav.js"></script>
</body>
</html>
