<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Завантаження…</title>
<script src="config.js"></script>
<style>
  html, body { margin:0; height:100%; background:#f3f1ea; font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color:#1d2a2e; }
  #msg { display:grid; place-items:center; height:100%; text-align:center; padding:20px; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:#fff; }
  .hidden { display:none; }
</style>
</head>
<body>
<div id="msg">Завантаження…</div>
<script>
(async () => {
  const msg = document.getElementById('msg');
  const id = new URLSearchParams(location.search).get('id') || '';
  if (!/^[a-f0-9]{8}$/.test(id)) { msg.textContent = 'Невірне посилання. Попросіть вчителя надіслати його ще раз.'; return; }
  if (!window.SCRIPT_URL) { msg.textContent = 'Посилання неповне. Попросіть вчителя надіслати його ще раз.'; return; }
  try {
    const r = await fetch(window.SCRIPT_URL + '?mat=' + id + '&r=' + Date.now());
    const j = await r.json();
    if (!j.ok) throw new Error(j.error === 'not_found' ? 'Цю сторінку вчитель вилучив або посилання застаріло.' : (j.error || 'Помилка'));
    document.title = j.title || 'Матеріал';
    const f = document.createElement('iframe');
    // Сторінка вчителя виконується в ізольованій «пісочниці»: вона працює, але не має доступу до цього сайту.
    f.setAttribute('sandbox', 'allow-scripts allow-forms allow-popups allow-modals allow-downloads');
    f.setAttribute('allow', 'autoplay; fullscreen; clipboard-write');
    f.srcdoc = j.html;
    document.body.appendChild(f); msg.classList.add('hidden');
  } catch (e) { msg.textContent = e.message && e.message !== 'Failed to fetch' ? e.message : 'Немає зв\'язку із сервером. Перевірте інтернет і спробуйте ще раз.'; }
})();
</script>
</body>
</html>
